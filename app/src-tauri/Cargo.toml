[package]
name = "hermes-app"
description = "Hermes desktop app: unlock screen, dashboards, timeline, privacy controls (Tauri). Reads the archive through hermes-viewer; records nothing itself."
version = "1.1.0"
authors = ["NotShanav"]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the main Hermes workspace and its Cargo.lock (built with --locked) stay untouched.
# Cargo.lock here was seeded from the main one, so shared crates keep their pinned versions.
[workspace]

[[bin]]
name = "hermes-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermes-cli = { path = "../../crates/hermes-cli" }
hermes-collector = { path = "../../crates/hermes-collector" }
hermes-crypto = { path = "../../crates/hermes-crypto" }
hermes-db = { path = "../../crates/hermes-db" }
hermes-platform = { path = "../../crates/hermes-platform" }
hermes-tracker = { path = "../../crates/hermes-tracker" }
hermes-tray = { path = "../../crates/hermes-tray" }
hermes-viewer = { path = "../../crates/hermes-viewer" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
