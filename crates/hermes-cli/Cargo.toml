[package]
name = "hermes-cli"
description = "The `hermes` command: init, start, stop, status, check, view, search, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hermes_cli"
path = "src/lib.rs"

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
hermes-collector = { path = "../hermes-collector" }
hermes-crypto = { path = "../hermes-crypto" }
hermes-db = { path = "../hermes-db" }
hermes-platform = { path = "../hermes-platform" }
hermes-tracker = { path = "../hermes-tracker" }
hermes-viewer = { path = "../hermes-viewer" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
hermes-crypto = { path = "../hermes-crypto", features = ["test-support"] }
tempfile.workspace = true
