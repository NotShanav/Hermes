[package]
name = "hermes-platform"
description = "Windows-specific integrations (DPAPI) behind hermes-crypto's SecretProtector trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hermes-crypto = { path = "../hermes-crypto" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security"] }
